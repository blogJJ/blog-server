# 테스트 전용 값. 운영 비밀값이 아니다.
app:
  jwt:
    secret: test-secret-for-jwt-signing-0123456789abcdef
  hash:
    secret: test-secret-for-hmac-hashing-0123456789abcdef
  # 테스트는 한 IP(127.0.0.1)로 많이 부르므로 기본 제한에 걸리지 않게 한다. 제한 자체는 RateLimitFilterTest에서 확인
  rate-limit:
    api-per-minute: 1000000
  mail:
    log-only: true
  # 테스트에서 올린 이미지는 build 아래에 둔다
  storage:
    local-dir: build/test-uploads
  # 테스트는 블로그 저장 뒤 따로 도는 마스코트 고르기를 끈다. MascotServiceTest가 직접 부른다
  mascot:
    enabled: false
    api-key: ""
  # 대표 그림도 진짜 API를 부르지 않는다. CoverArtServiceTest가 가짜 클라이언트로 확인한다
  cover-art:
    api-key: ""
  # 댓글 자동 검사도 진짜 API를 부르지 않는다. CommentModerationFlowTest가 가짜 클라이언트로 확인한다
  comment-filter:
    api-key: ""
