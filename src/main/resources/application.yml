# 값은 환경변수로 덮어쓴다. DB 접속 기본값만 로컬 개발용(docker-compose.yml의 MySQL)이다.
# 비밀값(DB 비밀번호, 메일 앱 비밀번호, JWT 키, Turnstile 키)은 저장소에 올리지 않는다. .env.example 참고.
#
# 실행 환경 (T144, OPS-11, D-111)
# - 이 파일은 운영 기준으로 안전하게 둔다(쿠키 Secure, Swagger 꺼짐, SQL 로그 꺼짐). 프로필을 빠뜨려도 위험하지 않게.
# - application-local.yml: 개발자 컴퓨터. ./gradlew bootRun이 local로 띄운다
# - application-prod.yml: 운영 서버. SPRING_PROFILES_ACTIVE=prod. 비밀값이 비었거나 예시 값이면 뜨지 않는다
# - 테스트는 src/test/resources/application-test.yml

spring:
  application:
    name: blog-server

  # 저장소 루트의 .env가 있으면 읽는다(없으면 무시)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog}

  jpa:
    # 스키마는 Flyway(db/migration)만 만든다. ddl-auto=update는 운영 금지 (research.md 이중화 7)
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

  # 인증번호·안내 메일 (USR-02, D-69). Gmail은 계정의 "앱 비밀번호"를 쓴다
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      # 글 이미지는 장당 3MB, 한 번에 10장 10MB (BRD-05)
      max-file-size: 3MB
      max-request-size: 10MB

# 상태 확인 주소는 /actuator/health 하나만, 결과는 UP/DOWN만 (T138, OPS-04, D-104)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # 메일 서버 연결은 서버 상태에 넣지 않는다. Gmail이 잠깐 안 돼도 서버는 살아 있다 (OPS-07)
    mail:
      enabled: false

# API 문서(Swagger)는 기본으로 닫는다. local에서만 연다 (T145, OPS-12, D-112)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # 기본 오류 응답에 내부 정보를 싣지 않는다 (OPS-02, D-102). API 오류는 GlobalExceptionHandler가 만든다
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  # 프록시(ALB 등) 뒤에서 X-Forwarded-* 헤더를 믿을지. 이중화 때 설정만 바꾼다 (SC-008)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

# 로그 파일 위치. local·test가 아니면 날짜별 파일로 남기고 30일 뒤 지운다 (T137, OPS-03, logback-spring.xml)
logging:
  file:
    path: ${LOG_PATH:./logs}

blog:
  limit:
    # 공개(일부 공개 포함) 블로그 개수. 최대 5까지 늘릴 수 있음 (BLG-10, D-68)
    public: ${BLOG_LIMIT_PUBLIC:3}
    private: 5

app:
  # 로그인 쿠키에 Secure를 붙인다. http://localhost에서 쓰는 local만 끈다 (SEC-04, OPS-11)
  cookie:
    secure: true
  # true면 http 요청을 https로 돌려보낸다. prod에서 켠다 (SEC-10, OPS-11)
  security:
    require-https: false
  jwt:
    # 32바이트 이상. 비어 있거나 짧으면 서버가 뜨지 않는다
    secret: ${JWT_SECRET:}
    # Access Token은 짧게, 만료되면 Refresh Token으로 다시 받는다 (SEC-04)
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  turnstile:
    site-key: ${TURNSTILE_SITE_KEY:}
    secret-key: ${TURNSTILE_SECRET_KEY:}
  storage:
    # 이미지 저장 위치. 1차는 서버 디스크, 이중화 때 S3 (SCL-02)
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
