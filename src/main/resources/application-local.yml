# 개발자 컴퓨터용 (T144, OPS-11, D-111). ./gradlew bootRun이 이 프로필로 띄운다.
# 운영 기준인 application.yml에서 개발에 필요한 것만 푼다.

app:
  # 로컬 개발용 기본값. 운영(prod)은 HASH_SECRET 환경변수가 꼭 있어야 뜬다
  hash:
    secret: ${HASH_SECRET:local-dev-hash-secret-not-for-production}
  # http://localhost에서는 Secure 쿠키가 저장되지 않으므로 끈다
  cookie:
    secure: false
  # Gmail 설정 없이 가입을 시험할 수 있게 메일은 콘솔에만 찍는다. 진짜로 보내려면 MAIL_LOG_ONLY=false와 MAIL_USERNAME·MAIL_PASSWORD
  mail:
    log-only: ${MAIL_LOG_ONLY:true}
  # Cloudflare가 공개한 시험용 키(항상 통과). 진짜 키는 TURNSTILE_SITE_KEY·TURNSTILE_SECRET_KEY 환경변수로
  turnstile:
    site-key: ${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
    secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

# Swagger: http://localhost:8080/swagger-ui.html (T145, OPS-12)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    # 실행되는 SQL을 콘솔에서 본다
    org.hibernate.SQL: debug
