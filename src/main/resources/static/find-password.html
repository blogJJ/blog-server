<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 찾기 - 블로그</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/find-password.js" defer></script>
  </head>
  <body>
    <!-- 비밀번호 찾기·재설정 (T099, USR-06, SEC-05, D-25). 인증번호와 새 비밀번호를 같은 화면에서 넣는다 -->
    <main>
      <section class="auth-card">
        <h1>비밀번호 찾기</h1>
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="code-form" novalidate>
          <div class="field" id="email-field">
            <label for="email">이메일</label>
            <input id="email" type="email" autocomplete="username" maxlength="100" required />
          </div>
          <p class="found-target" id="found-target" hidden></p>
          <button class="button button--block" type="submit" id="send-code">인증번호 받기</button>
          <p class="field__hint field__hint--spaced" id="send-hint" hidden></p>
        </form>
        <form id="reset-form" novalidate hidden>
          <div class="field">
            <label for="code">인증번호 6자리</label>
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" />
            <p class="field__hint">메일이 안 보이면 스팸함도 확인해 주세요. 30분 안에 입력해야 하고, 5번 틀리면 다시 받아야 해요.</p>
          </div>
          <div class="field">
            <label for="password">새 비밀번호</label>
            <input id="password" type="password" autocomplete="new-password" maxlength="15" />
            <p class="field__hint">8~15자, 영문·숫자·특수문자를 모두 넣어 주세요. 공백은 쓸 수 없어요.</p>
          </div>
          <div class="field">
            <label for="password2">새 비밀번호 확인</label>
            <input id="password2" type="password" autocomplete="new-password" maxlength="15" />
          </div>
          <p class="field__hint field__hint--spaced">바꾸면 다른 기기에서도 모두 로그아웃돼요.</p>
          <button class="button button--primary button--block" type="submit">비밀번호 바꾸기</button>
        </form>
        <p class="auth-links">
          <a href="/login.html">로그인</a> · <a href="/find-email.html">이메일 찾기</a>
        </p>
      </section>
    </main>
  </body>
</html>
