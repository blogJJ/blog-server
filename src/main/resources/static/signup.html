<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 - 블로그</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/theme.js"></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/social-login.js" defer></script>
    <script src="/js/signup.js" defer></script>
  </head>
  <body>
    <!-- 가입 3단계 (T038, USR-01, USR-02): 이메일 인증 → 비밀번호 → 이름·닉네임·전화번호·약관 동의 -->
    <main>
      <section class="auth-card">
        <h1>회원가입</h1>
        <!-- 소셜 로그인 (T157, D-128). 서버에 키가 있는 제공자 버튼만 social-login.js가 보여 준다. 로고는 외부에서 불러오지 않는다(CSP) -->
        <div class="social-login social-login--top" hidden>
          <p class="social-login__divider">또는 이메일로 가입</p>
          <a class="button button--block button--social" data-provider="google" href="/oauth2/authorization/google" hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Google로 계속하기</span>
          </a>
          <a class="button button--block button--social" data-provider="github" href="/oauth2/authorization/github" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>GitHub로 계속하기</span>
          </a>
        </div>
        <ol class="steps" aria-label="가입 단계">
          <li data-step="1">1. 이메일 인증</li>
          <li data-step="2">2. 비밀번호</li>
          <li data-step="3">3. 회원 정보</li>
        </ol>
        <p class="form-message form-message--error" id="message" role="alert"></p>

        <form id="step1" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <div class="field__row">
              <input id="email" type="email" autocomplete="email" maxlength="100" required />
              <button class="button" type="button" id="send-code">인증번호 받기</button>
            </div>
            <p class="field__hint" id="send-hint">이메일이 아이디가 돼요.</p>
          </div>
          <div class="field" id="code-field" hidden>
            <label for="code">인증번호 6자리</label>
            <input
              id="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="\d{6}"
            />
            <p class="field__hint">메일이 안 보이면 스팸함도 확인해 주세요. 10분 안에 입력해야 해요.</p>
          </div>
          <button class="button button--primary button--block" type="submit" id="verify" hidden>
            인증하고 다음으로
          </button>
        </form>

        <form id="step2" novalidate hidden>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="new-password" maxlength="15" />
            <p class="field__hint">8~15자, 영문·숫자·특수문자를 모두 넣어 주세요. 공백은 쓸 수 없어요.</p>
          </div>
          <div class="field">
            <label for="password2">비밀번호 확인</label>
            <input id="password2" type="password" autocomplete="new-password" maxlength="15" />
          </div>
          <button class="button button--primary button--block" type="submit">다음</button>
        </form>

        <form id="step3" novalidate hidden>
          <div class="field">
            <label for="name">이름</label>
            <input id="name" type="text" autocomplete="name" maxlength="30" />
          </div>
          <div class="field">
            <label for="nickname">닉네임</label>
            <input id="nickname" type="text" autocomplete="nickname" maxlength="12" />
            <p class="field__hint">2~12자 한글·영문·숫자. 다른 사람에게 보이는 이름이에요.</p>
          </div>
          <div class="field">
            <label for="phone">휴대폰 번호</label>
            <input id="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="13" />
            <p class="field__hint">숫자만 입력해도 돼요.</p>
          </div>
          <label class="check">
            <input id="agree-all" type="checkbox" />
            <strong>모두 동의</strong>
          </label>
          <label class="check">
            <input id="agree-terms" type="checkbox" />
            <span>[필수] <a href="/terms.html" target="_blank" rel="noopener">이용약관</a> 동의</span>
          </label>
          <label class="check">
            <input id="agree-privacy" type="checkbox" />
            <span
              >[필수]
              <a href="/privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a>
              동의</span
            >
          </label>
          <button class="button button--primary button--block" type="submit">가입하기</button>
        </form>

        <p class="auth-links">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
      </section>
    </main>
  </body>
</html>
