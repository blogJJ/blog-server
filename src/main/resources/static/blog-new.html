<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그 만들기 - 블로그</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/session.js" defer></script>
    <script src="/js/blog-card.js" defer></script>
    <script src="/js/blog-form.js" defer></script>
    <script src="/js/blog-new.js" defer></script>
  </head>
  <body>
    <!-- 블로그 만들기 (T054, BLG-01, BLG-10). 대표 이미지는 이미지 업로드(T062)가 생기면 더한다 -->
    <main>
      <section class="form-card">
        <h1>블로그 만들기</h1>
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="blog-form" novalidate>
          <div class="field">
            <label for="slug">주소</label>
            <div class="field__row">
              <span class="field__prefix">/blog/</span>
              <input id="slug" type="text" maxlength="30" autocomplete="off" autocapitalize="off" required />
              <button class="button" type="button" id="slug-check">중복 확인</button>
            </div>
            <p class="field__hint" id="slug-hint">영문 소문자, 숫자, -로 3~30자. 만든 뒤에는 바꿀 수 없어요.</p>
          </div>
          <div id="common-fields"></div>
          <button class="button button--primary button--block" type="submit">만들기</button>
        </form>
      </section>
    </main>
  </body>
</html>
