<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/session.js" defer></script>
    <script src="/js/blog-card.js" defer></script>
    <script src="/js/form-dialog.js" defer></script>
    <script src="/js/report.js" defer></script>
    <script src="/js/blog.js" defer></script>
    <script src="/js/post-list.js" defer></script>
  </head>
  <body>
    <!-- 블로그 첫 화면 /blog/{주소} (T055, BLG-01, BLG-04). 글 목록은 post-list.js(T071) -->
    <main>
      <div class="blocked" id="blocked" hidden>
        <h1 id="blocked-title">블로그를 볼 수 없어요</h1>
        <p id="blocked-desc"></p>
        <a class="button" href="/">메인으로</a>
      </div>
      <article id="blog" hidden>
        <div class="notice notice--danger" id="notice-closing" hidden></div>
        <div class="notice" id="notice-owner" hidden></div>
        <!-- 블로그 관리 버튼은 대표 이미지 오른쪽 아래에 둔다. 이미지가 없으면 이 줄 오른쪽 끝 -->
        <div class="blog-cover-wrap" id="cover-wrap" hidden>
          <img class="blog-cover" id="cover" alt="" hidden />
          <a class="button blog-cover-wrap__manage" id="manage" hidden>블로그 관리</a>
        </div>
        <header class="blog-hero">
          <div class="blog-hero__title">
            <h1 id="name"></h1>
            <span class="badge badge--muted" id="visibility" hidden></span>
          </div>
          <p class="blog-hero__desc" id="description"></p>
          <div id="tags"></div>
          <p class="blog-hero__meta" id="meta"></p>
          <div class="blog-hero__actions">
            <button class="button button--primary" type="button" id="join" hidden></button>
            <button class="button" type="button" id="cancel-join" hidden>신청 취소</button>
            <span class="blog-hero__state" id="join-state"></span>
            <button class="button button--text" type="button" id="report-blog" hidden>블로그 신고</button>
          </div>
        </header>
        <section class="share-box" id="share-box" hidden>
          <h2>공유 링크</h2>
          <p class="field__hint">이 링크를 받은 사람만 블로그를 볼 수 있어요. 관리 화면에서 새로 만들면 이 링크는 막혀요.</p>
          <div class="field__row">
            <input type="text" id="share-url" readonly aria-label="공유 링크" />
            <button class="button" type="button" id="copy-share">복사</button>
          </div>
        </section>
        <section class="blog-posts">
          <div class="blog-posts__head">
            <h2>글</h2>
            <div class="blog-posts__tools">
              <select id="category" aria-label="카테고리">
                <option value="">전체</option>
              </select>
              <select id="size" aria-label="한 페이지에 볼 글 수">
                <option value="10">10개씩</option>
                <option value="20">20개씩</option>
                <option value="30">30개씩</option>
              </select>
              <a class="button button--primary" id="write" hidden>글쓰기</a>
            </div>
          </div>
          <div class="post-row post-row--head" id="posts-head" aria-hidden="true">
            <span class="post-row__category">카테고리</span>
            <span class="post-row__cell-title">제목</span>
            <span class="post-row__author">글쓴이</span>
            <span class="post-row__date">날짜</span>
            <span class="post-row__num">조회</span>
            <span class="post-row__num">좋아요</span>
          </div>
          <ul class="post-list post-list--notice" id="notices"></ul>
          <ul class="post-list" id="posts"></ul>
          <p class="empty" id="posts-empty" hidden>아직 글이 없어요.</p>
          <nav class="pager" id="pager" aria-label="페이지"></nav>
        </section>
      </article>
    </main>
  </body>
</html>
