<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>글 - 블로그</title>
    <!--og-->
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/session.js" defer></script>
    <script src="/js/blog-card.js" defer></script>
    <script src="/js/form-dialog.js" defer></script>
    <script src="/js/report.js" defer></script>
    <script src="/js/post-view.js" defer></script>
    <script src="/js/comments.js" defer></script>
  </head>
  <body>
    <!-- 글 상세 /blog/{주소}/posts/{번호} (T071, BRD-01, BRD-07). og 태그는 서버가 채운다(T069). 좋아요·댓글(BRD-06) -->
    <main>
      <div class="blocked" id="blocked" hidden>
        <h1 id="blocked-title">글을 볼 수 없어요</h1>
        <p id="blocked-desc"></p>
        <a class="button" href="/">메인으로</a>
      </div>
      <article class="post" id="post" hidden>
        <a class="post__blog" id="blog-link"></a>
        <h1 class="post__title" id="title"></h1>
        <p class="post__meta" id="meta"></p>
        <div class="post__actions">
          <button class="button like-button" type="button" id="like" aria-pressed="false">♡ 좋아요</button>
          <button class="button" type="button" id="copy-link">링크 복사</button>
          <a class="button" id="edit" hidden>수정</a>
          <button class="button button--danger" type="button" id="delete" hidden>삭제</button>
          <button class="button" type="button" id="report" hidden>신고</button>
        </div>
        <!-- 본문은 서버가 걸러낸 HTML이라 이곳만 innerHTML로 넣는다 (SEC-06) -->
        <div class="post__body" id="body"></div>
        <div id="tags"></div>
        <p class="post__counts" id="counts"></p>
        <a class="button" id="back">목록으로</a>
      </article>
      <section class="comments" id="comments" hidden>
        <h2 class="comments__title">댓글 <span id="comment-count">0</span></h2>
        <form class="comment-form" id="comment-form" novalidate hidden>
          <textarea id="comment-input" maxlength="500" rows="3" placeholder="댓글을 남겨 주세요." aria-label="댓글"></textarea>
          <div class="comment-form__foot">
            <span class="field__hint" id="comment-length">0/500</span>
            <button class="button button--primary" type="submit">등록</button>
          </div>
        </form>
        <p class="field__hint" id="comment-login" hidden><a href="#" id="comment-login-link">로그인</a>하면 댓글을 남길 수 있어요.</p>
        <ul class="comment-list" id="comment-list"></ul>
        <p class="empty" id="comment-empty" hidden>첫 댓글을 남겨 보세요.</p>
        <button class="button" type="button" id="comment-more" hidden>댓글 더 보기</button>
      </section>
    </main>
  </body>
</html>
