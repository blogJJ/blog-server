<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원 탈퇴 - J blog</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/theme.js"></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/withdraw.js" defer></script>
  </head>
  <body>
    <!-- 회원 탈퇴 (T094, USR-05, D-05, D-15, D-18) -->
    <main>
      <section class="auth-card auth-card--wide" id="withdraw" hidden>
        <h1>회원 탈퇴</h1>

        <div id="blocked" hidden>
          <div class="notice notice--danger">블로그장인 블로그가 있어 지금은 탈퇴할 수 없어요.</div>
          <p class="field__hint" id="guide"></p>
          <ul class="admin-list" id="blogs"></ul>
        </div>

        <form id="withdraw-form" novalidate hidden>
          <ul class="field__hint">
            <li>로그인용 이메일은 바로 지워져 같은 이메일로 다시 가입할 수 있어요. 다시 가입해도 예전 계정과는 연결되지 않아요.</li>
            <li>쓴 글과 댓글은 지워지지 않고 작성자가 "탈퇴한 회원"으로 바뀌어요.</li>
            <li>참여한 블로그에서는 모두 빠지고, 30일 뒤 이름·닉네임·전화번호·프로필 사진이 지워져요.</li>
          </ul>
          <div class="field" id="password-field">
            <label for="password">비밀번호 확인</label>
            <input id="password" type="password" autocomplete="current-password" maxlength="15" />
          </div>
          <label class="check">
            <input type="checkbox" id="agree" />
            <span>위 내용을 확인했고 탈퇴할게요.</span>
          </label>
          <p class="form-message form-message--error" id="message" role="alert"></p>
          <button class="button button--danger" type="submit">탈퇴하기</button>
        </form>
      </section>
    </main>
  </body>
</html>
