<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 - 블로그</title>
    <link rel="stylesheet" href="/css/common.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/login.js" defer></script>
  </head>
  <body>
    <!-- 로그인 (T039, USR-03, SEC-03, SEC-13) -->
    <main>
      <section class="auth-card">
        <h1>로그인</h1>
        <p class="form-message form-message--error" id="message" role="alert"></p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" autocomplete="username" maxlength="100" required />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" maxlength="15" required />
          </div>
          <label class="check">
            <input id="remember-me" type="checkbox" />
            <span>로그인 유지</span>
          </label>
          <p class="field__hint field__hint--spaced">
            체크하면 14일 동안 로그인이 유지돼요. 공용 컴퓨터에서는 체크하지 마세요.
          </p>
          <!-- 3번째 실패부터 사람 확인을 띄운다 -->
          <div class="captcha" id="captcha" hidden></div>
          <button class="button button--primary button--block" type="submit">로그인</button>
        </form>
        <p class="auth-links">
          <a href="/find-email.html">이메일 찾기</a> · <a href="/find-password.html">비밀번호 찾기</a> · <a href="/signup.html">회원가입</a>
        </p>
      </section>
    </main>
  </body>
</html>
