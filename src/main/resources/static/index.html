<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J blog</title>
    <!--og-->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/mascot.css" />
    <!-- 블로그·글 화면에서만 쓰는 스크립트를 한가할 때 미리 받아 둔다 (T164) -->
    <link rel="prefetch" href="/js/form-dialog.js" />
    <link rel="prefetch" href="/js/report.js" />
    <link rel="prefetch" href="/js/blog.js" />
    <link rel="prefetch" href="/js/post-list.js" />
    <link rel="prefetch" href="/js/post-view.js" />
    <link rel="prefetch" href="/js/comments.js" />
    <script src="/js/theme.js"></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/session.js" defer></script>
    <script src="/js/mascot.js" defer></script>
    <script src="/js/pixel-cover.js" defer></script>
    <script src="/js/blog-card.js" defer></script>
    <script src="/js/feed.js" defer></script>
  </head>
  <body>
    <!-- 메인: 인기 글 큰 카드와 추천 블로그(D-149), 피드 탭(최신·인기·팔로우·구독)과 블로그 둘러보기 (T110, BRD-09, BLG-02).
         검색은 위 통합 검색 칸 → search.html(BRD-08) -->
    <main class="home">
      <section class="home-hero" aria-label="인기 글과 추천 블로그">
        <div class="home-hero__inner">
          <div class="hot">
            <div class="home-head">
              <h2 class="home-head__title"><span class="home-head__accent">인기 글</span><span class="home-head__more"><span class="home-head__sep" aria-hidden="true">›</span>좋아요를 많이 받은 글</span></h2>
              <div class="dots" id="hot-pages"></div>
            </div>
            <div class="hot__cards" id="hot-cards"></div>
          </div>
          <aside class="pick">
            <div class="home-head">
              <h2 class="home-head__title">추천 블로그</h2>
              <div class="dots" id="pick-pages"></div>
            </div>
            <div class="pick__card" id="pick-card"></div>
          </aside>
        </div>
      </section>
      <div class="home-body">
        <div class="home-main">
          <div class="tabs" role="tablist" id="tabs">
            <button class="tabs__item is-current" type="button" role="tab" data-tab="latest">최신 글</button>
            <button class="tabs__item" type="button" role="tab" data-tab="popular">인기 글</button>
            <button class="tabs__item" type="button" role="tab" data-tab="following" hidden>팔로우</button>
            <button class="tabs__item" type="button" role="tab" data-tab="subscribed" hidden>구독</button>
            <button class="tabs__item" type="button" role="tab" data-tab="blogs">블로그 둘러보기</button>
          </div>
          <div class="sub-tabs" id="blog-sort" hidden>
            <button class="button button--text is-current" type="button" data-sort="latest">최신순</button>
            <button class="button button--text" type="button" data-sort="popular">인기순</button>
          </div>
          <ul class="feed-list" id="feed"></ul>
          <div class="blog-grid" id="blogs" hidden></div>
          <p class="empty" id="empty" hidden></p>
          <nav class="pager" id="pager" aria-label="페이지"></nav>
        </div>
        <aside class="home-side">
          <section class="login-box" id="login-box" aria-label="로그인"></section>
          <section class="side-box" aria-labelledby="side-notices-title">
            <div class="side-box__head">
              <h2 id="side-notices-title">공지사항</h2>
              <a href="/notices.html">더보기</a>
            </div>
            <ul class="side-list" id="side-notices"></ul>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
