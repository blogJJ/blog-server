plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.3'
}

group = 'com.blog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹·보안·DB (SEC-10~12, constitution I)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // 상태 확인 주소 /actuator/health만 연다 (T138, OPS-04)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 인증번호·안내 메일, Gmail SMTP (USR-02, D-69)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT를 HttpOnly 쿠키에 담음 (SEC-04)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 글 본문: 마크다운 → HTML 변환 후 jsoup으로 걸러냄 (SEC-06, D-64)
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    // 이미지 EXIF 확인·제거 (BRD-05)
    implementation 'com.drewnoakes:metadata-extractor:2.21.0'

    // API 문서(Swagger). local 프로필에서만 연다 (T145, OPS-12)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // 04:00 배치를 서버 한 대에서만 실행 (SCL-03)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // 통합 테스트는 Docker로 진짜 MySQL 8을 띄워 Flyway·엔티티 매핑까지 확인한다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 코드 모양 맞추기: ./gradlew spotlessApply 로 고치고, build 때 spotlessCheck가 검사
spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ./gradlew bootRun은 local 프로필로 뜬다. 다른 프로필은 SPRING_PROFILES_ACTIVE로 (T144, OPS-11)
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

tasks.named('test') {
    useJUnitPlatform()
    // 운영과 같은 시간대. BlogServerApplication.main이 정하는 것을 테스트에서도 맞춘다
    systemProperty 'user.timezone', 'Asia/Seoul'
}
