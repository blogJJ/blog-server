plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.blog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹·보안·DB (SEC-10~12, constitution I)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // 상태 확인 주소 /actuator/health만 연다 (T138, OPS-04)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 구글·깃허브 소셜 로그인 (T157, D-128)
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 인증번호·안내 메일, Gmail SMTP (USR-02, D-69)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT를 HttpOnly 쿠키에 담음 (SEC-04)
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 글 본문: 마크다운 → HTML 변환 후 jsoup으로 걸러냄 (SEC-06, D-64)
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    // 이미지 EXIF 확인·제거 (BRD-05)
    implementation 'com.drewnoakes:metadata-extractor:2.21.0'
    // 올린 사진을 줄여 WebP로 저장 (T162). libwebp를 JNI로 묶어 리눅스 x64·arm64, 맥, 윈도우용이 jar에 들어 있다
    implementation 'com.github.usefulness:webp-imageio:0.11.0'

    // 공유 미리보기: Claude가 그린 SVG 대표 그림을 PNG로 바꿈. 순수 자바, 의존성 없음, MIT (T161)
    implementation 'com.github.weisj:jsvg:2.2.0'

    // API 문서(Swagger). local 프로필에서만 연다 (T145, OPS-12)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // 04:00 배치를 서버 한 대에서만 실행 (SCL-03)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // 블로그 이름·태그로 마스코트 동물 고르기 (BLG-14, D-116)
    implementation 'com.anthropic:anthropic-java:3.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // 통합 테스트는 Docker로 진짜 MySQL 8을 띄워 Flyway·엔티티 매핑까지 확인한다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 코드 모양 맞추기: ./gradlew spotlessApply 로 고치고, build 때 spotlessCheck가 검사
spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ./gradlew bootRun은 local 프로필로 뜬다. 다른 프로필은 SPRING_PROFILES_ACTIVE로 (T144, OPS-11)
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

tasks.named('test') {
    useJUnitPlatform()
    // 운영과 같은 시간대. BlogServerApplication.main이 정하는 것을 테스트에서도 맞춘다
    systemProperty 'user.timezone', 'Asia/Seoul'
    finalizedBy 'jacocoTestReport'
}

// 테스트 커버리지: build/reports/jacoco/test/html/index.html, SonarQube·SonarLint가 읽는 XML도 함께 만든다
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

// SonarQube 분석: CI가 main·develop 푸시 때 ./gradlew sonar로 보낸다. 주소·토큰은 SONAR_HOST_URL·SONAR_TOKEN 시크릿
sonar {
    properties {
        property 'sonar.projectKey', 'jj-blog'
        property 'sonar.projectName', 'jj-blog'
        property 'sonar.coverage.jacoco.xmlReportPaths', "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

// 배포용 실행 파일은 build/libs/blog-server.jar 하나만 만든다. Dockerfile이 이 이름으로 복사한다
tasks.named('bootJar') {
    archiveFileName = 'blog-server.jar'
}
tasks.named('jar') {
    enabled = false
}
