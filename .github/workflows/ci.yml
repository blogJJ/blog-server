# PR과 main·develop 푸시마다 ./gradlew build(코드 모양 검사, 컴파일, 테스트)를 돌린다 (T135, OPS-05, D-105)
# Git Flow (T165): develop은 CI만 돌고, main의 CI가 통과하면 Deploy → Release가 이어진다(deploy.yml, release.yml은 main만)
# 이 검사를 merge 필수로 하려면 저장소 관리자가 GitHub 설정 > Branches > main 보호 규칙에서
# "Require status checks to pass"를 켜고 build와 migrations를 고른다. develop에도 같은 규칙을 건다.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube가 새로 바뀐 코드를 가려내려면 전체 이력이 필요하다
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # SonarQube 분석 (jj-blog). main·develop 푸시 때만, SONAR_TOKEN 시크릿이 있을 때만 돈다
      - name: Check SonarQube token
        id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarQube
        if: github.event_name == 'push' && steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar

  # 이미 merge된 Flyway 파일을 고치지 않았는지, 파일 이름과 번호가 맞는지 (T143, OPS-08, D-108)
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Flyway migrations
        run: .github/scripts/check-migrations.sh "origin/${{ github.base_ref }}"
