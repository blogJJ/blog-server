# PR과 main 푸시마다 ./gradlew build(코드 모양 검사, 컴파일, 테스트)를 돌린다 (T135, OPS-05, D-105)
# 이 검사를 merge 필수로 하려면 저장소 관리자가 GitHub 설정 > Branches > main 보호 규칙에서
# "Require status checks to pass"를 켜고 build를 고른다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시
      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build
