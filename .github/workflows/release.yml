# 업데이트 기록 (릴리즈 노트).
# 운영 배포(Deploy)가 성공할 때마다 그 커밋에 버전 태그를 붙이고 GitHub Releases에 버전별 페이지를 만든다.
# 내용은 지난 릴리즈 뒤로 머지된 PR 제목을 모은 것(.github/release.yml로 묶는다).
# 버전은 v1.0.0에서 시작해 배포마다 마지막 자리를 하나씩 올린다. 크게 바뀐 배포는 Releases 화면에서 직접 고쳐도 된다.
# 같은 커밋을 다시 배포하면(더미 데이터 넣기 등) 새 릴리즈를 만들지 않는다.
name: Release

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        run: |
          if [ -n "$(git tag --points-at "$SHA" -l 'v*')" ]; then
            echo "이 커밋은 이미 $(git tag --points-at "$SHA" -l 'v*')로 나갔어요. 새 릴리즈를 만들지 않아요"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ -z "$last" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "다음 버전: $next (이전: ${last:-없음})"

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --target "$SHA" \
            --title "$NEXT ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --generate-notes \
            --latest
