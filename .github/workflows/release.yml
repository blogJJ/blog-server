# 업데이트 기록 (릴리즈 노트, T156 D-127, T159 D-130).
# 운영 배포(Deploy)가 성공하면 src/main/resources/release-notes.json의 가장 새 버전(releases[0])으로
# 그 커밋에 태그를 붙이고 GitHub Releases에 버전 페이지를 만든다.
# - 버전 번호와 제목은 파일이 정한다. 사이트의 /release-notes.html과 GitHub Releases가 같은 번호를 쓴다.
#   MAJOR는 아주 큰 업데이트, MINOR는 기능 추가(새 사용자 스토리·기능), PATCH는 버그 수정·작은 변경.
#   어느 자리를 올릴지는 PR을 만드는 사람이 정해 파일 맨 위에 적는다. 워크플로가 스스로 번호를 올리지 않는다.
# - 릴리즈 본문은 파일의 바뀐 점 뒤에 지난 태그 뒤로 머지된 PR 제목(--generate-notes, .github/release.yml로 묶음)을 붙인다.
# - 파일의 가장 새 버전이 이미 태그로 있으면(노트를 더하지 않은 배포, 같은 커밋 다시 배포, 더미 데이터 넣기 등) 건너뛴다.
#   새 버전을 내려면 PR에서 release-notes.json 맨 위에 항목을 더한다.
name: Release

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      NOTES_FILE: src/main/resources/release-notes.json
    steps:
      - uses: actions/checkout@v7
        with:
          # 배포한 커밋의 노트 파일을 읽는다
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Pick version
        id: version
        run: |
          version="$(jq -r '.releases[0].version' "$NOTES_FILE")"
          title="$(jq -r '.releases[0].titles | join(", ")' "$NOTES_FILE")"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$NOTES_FILE 맨 위 버전이 v1.0.0 꼴이 아니에요: $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "$version 태그가 이미 있어요. 새 릴리즈를 만들지 않아요 (새 버전은 $NOTES_FILE 맨 위에 더해요)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::$NOTES_FILE 맨 위 버전($version)이 마지막 태그($last)보다 낮아요"
            exit 1
          fi
          {
            echo "version=$version"
            echo "title=$version — $title"
            echo "last=$last"
          } >> "$GITHUB_OUTPUT"
          echo "새 버전: $version — $title (이전 태그: ${last:-없음})"

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          # 파일의 바뀐 점을 본문 앞에 둔다. GitHub이 그 뒤에 PR 목록을 붙인다
          jq -r '.releases[0].changes[] | "- " + .' "$NOTES_FILE" > "$RUNNER_TEMP/notes.md"
          start=()
          if [ -n "$LAST" ]; then
            start=(--notes-start-tag "$LAST")
          fi
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes "${start[@]}" \
            --latest
